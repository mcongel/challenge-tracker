name: Nightly backup

on:
  schedule:
    # 21:40 UTC daily — after the weekday snapshot slot.
    - cron: '40 21 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # Prod deps only: the script needs @supabase/supabase-js and nothing
      # else — no reason to install the frontend toolchain into a runner
      # holding the service-role key.
      - run: npm ci --omit=dev
      - run: npm run backup -- backup.json
        env:
          SUPABASE_URL: https://mlvntnbgboinjhmavwao.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: challenge-backup-${{ github.run_id }}
          path: backup.json
          retention-days: 90
