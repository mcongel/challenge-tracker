name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Both configs — app AND scripts. Kept out of `build` so a script-only
      # type error can't block a Cloudflare Pages deploy of unrelated UI.
      - run: npm run typecheck
      - run: npm run build
